name: Wiki Fetch & Update

on:
  schedule:
    - cron: '0 */1 * * *'

  # 用户 push 触发，排除脚本写入的 data 目录
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'README.md'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-fetch
  cancel-in-progress: true

jobs:
  fetch-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            README.md
            clash_template.yaml
            data
            src
            package.json

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Fetch and extract Wiki pages
        timeout-minutes: 1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run begin

      - name: Check subscription changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/sub.txt data/sub.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README Timestamp
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          export TZ='Asia/Shanghai'
          current_time=$(date "+%Y-%m-%d %H:%M:%S")

          sed -i '/更新于/d' README.md
          printf '更新于 %s\n' "$current_time" >> README.md

      - name: Commit & Push generated files
        if: steps.changes.outputs.changed == 'true' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/sub.txt data/sub.yaml
          git commit -m "chore: wiki update & readme timestamp [skip ci]"
          git push
